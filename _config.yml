title: "Fei's blog"
description: 个人博客
baseurl: ""  # 如果您的站点位于 username.github.io，保持为空
url: "https://yourusername.github.io"  # 替换为您的 GitHub Pages URL

# 在本地开发时使用相对 URL
development:
  url: ""

# 修改导航栏项目
navigation:
  - title: Home
    url: /
  - title: Posts
    url: /posts
  - title: Support
    url: /support

# 作者信息
author:
  name: Your Name
  bio: Maecenas facilisis, ipsum a dapibus mattis, risus sapien finibus velit, sed pharetra tellus sem ac ligula.
  image: /assets/images/author.jpg

# 社交媒体链接
social:
  - icon: fab fa-facebook-f
    url: https://facebook.com/yourusername
  - icon: fab fa-twitter
    url: https://twitter.com/yourusername
  - icon: fab fa-linkedin-in
    url: https://linkedin.com/in/yourusername
  - icon: fab fa-instagram
    url: https://instagram.com/yourusername
  - icon: fab fa-pinterest-p
    url: https://pinterest.com/yourusername
  - icon: fab fa-youtube
    url: https://youtube.com/yourusername

# 分页设置
paginate: 10
paginate_path: "/posts/page:num/"

# 其他Jekyll设置
markdown: kramdown
plugins:
  - jekyll-paginate
  - jekyll-feed

theme: minima

# 其他设置保持不变