---
layout: default
---

<div class="home-wrapper">
  <div class="home-main">
    <h1 class="page-heading">{{ page.title }}</h1>

    {{ content }}

    {%- if site.posts.size > 0 -%}
      <h3 class="post-list-heading">
        <a href="{{ '/posts' | relative_url }}">More Posts...</a>
      </h3>
    {%- endif -%}
  </div>

  <div class="home-sidebar">
    <div class="sidebar">
      <h2>About the Author</h2>
      <img src="{{ site.author.image | relative_url }}" alt="{{ site.author.name }}" class="author-image">
      <p>{{ site.author.bio }}</p>
      <div class="social-links">
        {% for social in site.social %}
          <a href="{{ social.url }}" target="_blank"><i class="{{ social.icon }}"></i></a>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
